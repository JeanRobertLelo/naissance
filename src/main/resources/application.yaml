spring:
  application:
    name: ms-naissance
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate  # Les champs de mes entités correspondent à ceux des tables en BDD
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  servlet:
    context-path: /api

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  packages-to-scan:
    - jr.lelo.bnaiss.web
  paths-to-match:
    - /api/**


app:
  mailpit:
    base-url: ${MAILPIT_BASE_URL:http://localhost:8025}
    from: ${MAILPIT_FROM:no-reply@ms-naissance.test}

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.security: TRACE